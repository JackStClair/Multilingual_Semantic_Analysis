<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review medium imports — Nuance MT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="brand" href="/">Nuance MT</a>
      <nav>
        <a href="/">Translate</a>
        <a href="/review" aria-current="page">Review imports</a>
      </nav>
    </header>

    <main class="review">
      <h1>Human-clean medium imports</h1>
      <p class="lede">
        Rewrite thin English hosts, fix the highlighted span, then accept or reject.
        Shortcuts: <kbd>A</kbd> accept · <kbd>E</kbd> save edits · <kbd>R</kbd> reject · <kbd>S</kbd> skip.
      </p>

      <div class="row">
        <label class="field inline">
          <span>Lang pair</span>
          <select id="lang">
            <option value="all">All</option>
            <option value="en-de">en-de</option>
            <option value="en-ja">en-ja</option>
          </select>
        </label>
        <label class="field inline">
          <span>Reviewer id</span>
          <input id="reviewer" type="text" value="jack" />
        </label>
        <p id="queue" class="status">Loading queue…</p>
      </div>

      <section id="card" class="card" hidden>
        <p class="meta" id="meta"></p>

        <label class="field">
          <span>English sentence (edit if context is too thin)</span>
          <textarea id="source_text" rows="4"></textarea>
        </label>

        <div class="preview-block">
          <span class="field-label">Live preview</span>
          <p class="prose" id="sentence"></p>
          <p id="span-warning" class="warn" hidden></p>
        </div>

        <div class="row">
          <label class="field" style="flex: 2">
            <span>Nuance span in English</span>
            <input id="src_span" placeholder="homeland" />
          </label>
          <button type="button" class="ghost" id="locate" style="margin-bottom: 0.9rem">
            Find span in sentence
          </button>
        </div>

        <details class="advanced">
          <summary>Advanced offsets</summary>
          <div class="row" style="margin-top: 0.75rem">
            <label class="field inline"><span>Start</span><input id="src_char_start" type="number" /></label>
            <label class="field inline"><span>End</span><input id="src_char_end" type="number" /></label>
          </div>
        </details>

        <div class="row">
          <label class="field inline"><span>Type</span>
            <select id="nuance_type">
              <option>political_social</option>
              <option>self_other</option>
              <option>affect_atmosphere</option>
              <option>politeness_stance</option>
              <option>institutional_legal</option>
              <option>untranslatable_lexical</option>
            </select>
          </label>
          <label class="field inline"><span>Target-language span</span><input id="tgt_span" /></label>
        </div>

        <label class="field"><span>English frame</span><input id="en_frame" /></label>
        <label class="field"><span>Target frame</span><input id="target_frame" /></label>
        <label class="field"><span>Explanation</span><textarea id="explanation" rows="4"></textarea></label>
        <label class="field"><span>Evidence</span><textarea id="evidence" rows="2"></textarea></label>

        <div class="actions sticky-actions">
          <button type="button" class="danger" id="reject">Reject</button>
          <button type="button" class="ghost" id="skip">Skip</button>
          <button type="button" id="accept">Accept</button>
          <button type="button" class="primary" id="edit">Save edits + accept</button>
        </div>
      </section>

      <p id="empty" class="lede" hidden>Queue clear for this filter. Nice.</p>
    </main>
  </div>
  <script src="/static/review.js"></script>
</body>
</html>
